# Присылает запрос на слияние, когда у шагов сборки и проверки выходит новая
# версия: старые версии действий GitHub со временем снимает с поддержки, и
# сборщик, который работает сам по расписанию, иначе узнал бы об этом по
# остановке.
#
# Раз в месяц, как в приложении: действий шесть, чаще — только шум.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
