name: Сбор данных
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [overrides.json]
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.collect.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19"
      - name: Состояние прошлого запуска
        uses: actions/cache/restore@v4
        with:
          path: .collector-state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-
      - name: Сбор
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/main.ts
      - name: Сохранить состояние
        if: always() && hashFiles('.collector-state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .collector-state
          key: collector-state-${{ github.run_id }}
      - name: Упаковать файл для Pages
        if: always() && steps.collect.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled' && needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
